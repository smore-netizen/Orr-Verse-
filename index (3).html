<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<script>
/* ======================================================
   1) PASTE YOUR FIREBASE CONFIG HERE
   Get this from: Firebase Console > Project Settings > Your apps > Web app
   ====================================================== */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

/* ======================================================
   2) PASTE YOUR VAPID KEY HERE (for push notifications)
   Get this from: Firebase Console > Project Settings > Cloud Messaging
   > Web configuration > Generate key pair
   ====================================================== */
const VAPID_KEY = "PASTE_YOUR_VAPID_KEY";

const NEEDS_SETUP = firebaseConfig.apiKey.startsWith("PASTE_");

/* ======================================================
   PASSCODE GATE — the passcode itself isn't stored here,
   only a one-way hash of it, so it isn't sitting in the
   page source in plain text.
   ====================================================== */
const PASSCODE_HASH = "dc09acffb355b110a934de3c0c50fb51ccd0c842c4e04c91ac0dc98127b4611c";
let unlocked = localStorage.getItem('workbook-unlocked') === 'true';

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function tryUnlock(){
  const input = document.getElementById('passcode-input');
  const val = input.value.trim().toLowerCase();
  const hash = await sha256Hex(val);
  const errEl = document.getElementById('lock-error');
  if(hash === PASSCODE_HASH){
    unlocked = true;
    localStorage.setItem('workbook-unlocked', 'true');
    render();
  } else {
    errEl.textContent = "That's not it — try again.";
    input.value = "";
    input.focus();
  }
}

const BOOKS = [
["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],
["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],["Esther",10],
["Job",42],["Psalms",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],
["Isaiah",66],["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],
["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],
["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]
];
const SECTIONS = [
  {name:"Law", bStart:0, bEnd:4},{name:"History", bStart:5, bEnd:16},{name:"Wisdom", bStart:17, bEnd:21},
  {name:"Prophets", bStart:22, bEnd:38},{name:"Gospels", bStart:39, bEnd:43},{name:"Epistles", bStart:44, bEnd:65},
];
const FLAT = [];
BOOKS.forEach((b,bi)=>{ for(let c=1;c<=b[1];c++){ FLAT.push({bookIdx:bi, book:b[0], chapter:c}); } });
const TOTAL = FLAT.length;
const NAMES = { savanna: "Savanna", jack: "Jack" };

let identity = localStorage.getItem('workbook-identity') || null;
let notifStatus = localStorage.getItem('workbook-notif-status') || 'off'; // off | pending | on | denied
let messaging = null;
let data = null;
let openJournalIdx = null;
let db = null;
let synced = false;
let pendingTags = { savanna:"", jack:"" };
let journalSearchTerm = "";

function todayStr(){ return new Date().toDateString(); }
function defaultData(){ return { currentIndex:0, lastAdvancedDate:null, startDate: todayStr(), entries:{}, prayers:[], streak:{count:0, graceMonth:"", graceUsed:0}, justFinishedBook:null }; }
function entryFor(idx){
  if(!data.entries[idx]) data.entries[idx] = { savanna:{verse:"",reflection:"",question:"",tag:"",ts:null}, jack:{verse:"",reflection:"",question:"",tag:"",ts:null}, replies:[] };
  if(data.entries[idx].savanna.tag === undefined) data.entries[idx].savanna.tag = "";
  if(data.entries[idx].jack.tag === undefined) data.entries[idx].jack.tag = "";
  return data.entries[idx];
}
const TAGS = ["Convicting","Comforting","Hard to read","Joyful","Confusing"];
function sectionOf(bookIdx){ return SECTIONS.find(s=> bookIdx>=s.bStart && bookIdx<=s.bEnd); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function saveData(){
  try{ await db.collection('workbook').doc('data').set(data); }catch(e){ console.error('save failed', e); }
}

function renderLock(){
  return `
  <div class="lock-gate">
    <div class="ribbon-icon">✦</div>
    <h1>This one's just for us</h1>
    <p>Enter the passcode to open the workbook.</p>
    <input type="password" id="passcode-input" placeholder="Passcode" autocomplete="off" autofocus
      onkeydown="if(event.key==='Enter') tryUnlock()">
    <br>
    <button onclick="tryUnlock()">Unlock</button>
    <p class="lock-error" id="lock-error"></p>
  </div>`;
}

function renderSetup(){
  return `
  <div class="setup-card">
    <h1>One more step</h1>
    <p>This app needs a free Firebase project to sync between your two phones. Open <code>index.html</code>, find the <code>firebaseConfig</code> block near the top of the script, and paste in your project's keys from the Firebase Console (Project Settings → Your apps → Web app).</p>
    <p>Until then, here's a preview with the config left blank.</p>
  </div>`;
}

function renderGate(){
  return `
  <div class="gate">
    <h1>Who's opening this today?</h1>
    <p>We'll remember your choice on this device.</p>
    <div class="gate-btns">
      <button class="gate-btn savanna" onclick="saveIdentity('savanna')">Savanna</button>
      <button class="gate-btn jack" onclick="saveIdentity('jack')">Jack</button>
    </div>
  </div>`;
}
function saveIdentity(who){ identity = who; localStorage.setItem('workbook-identity', who); render(); }
function switchUser(){ identity = null; localStorage.removeItem('workbook-identity'); render(); }

function renderRibbon(){
  const sections = SECTIONS.map(s=>{
    let count=0, done=0;
    FLAT.forEach((f,i)=>{ if(f.bookIdx>=s.bStart && f.bookIdx<=s.bEnd){ count++; if(i < data.currentIndex) done++; } });
    return {name:s.name, count, pct: count ? (done/count*100) : 0};
  });
  const segs = sections.map(s=> `<div class="seg" style="flex:${s.count}"><div class="seg-fill" style="width:${s.pct}%"></div></div>`).join("");
  const labels = sections.map(s=> `<div class="seg-label" style="flex:${s.count}">${s.name}</div>`).join("");
  const pctDone = ((data.currentIndex/TOTAL)*100).toFixed(1);
  const remaining = TOTAL - data.currentIndex;
  const projected = new Date(Date.now() + remaining*86400000);
  const projStr = projected.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  const streak = data.streak || {count:0, graceUsed:0};
  const graceLeft = Math.max(0, GRACE_DAYS_PER_MONTH - (streak.graceUsed||0));
  return `
  <div class="ribbon-card">
    <div class="day-count">Day <b>${data.currentIndex+1}</b> of ${TOTAL}</div>
    <div class="progress-track">${segs}</div>
    <div class="seg-labels">${labels}</div>
    <div class="progress-stat">${pctDone}% through the Bible · ${remaining} chapters to go · finishing around ${projStr} at this pace</div>
    <div class="streak-row">
      <span class="streak-badge">🔥 ${streak.count||0} day${streak.count===1?'':'s'} together</span>
      <span class="grace-note">${graceLeft} grace day${graceLeft===1?'':'s'} left this month for busy weeks</span>
    </div>
  </div>`;
}

function renderToday(){
  const idx = data.currentIndex;
  const f = FLAT[idx];
  const e = entryFor(idx);
  const partner = identity === 'savanna' ? 'jack' : 'savanna';
  const order = ['savanna','jack'];
  pendingTags.savanna = e.savanna.tag || "";
  pendingTags.jack = e.jack.tag || "";
  const page = (who)=>{
    const d = e[who];
    const isMe = who === identity;
    const stamp = d.ts ? `saved ${new Date(d.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}` : 'not written yet';
    const sideClass = who===order[0] ? 'left' : 'right';
    if(isMe){
      return `
      <div class="page ${sideClass}">
        <p class="page-name"><span class="dot ${who}"></span>${NAMES[who]} (you)</p>
        <label>Favorite verse</label>
        <input type="text" id="verse-${who}" placeholder="e.g. Exodus 14:14" value="${escapeHtml(d.verse)}">
        <label>Reflection</label>
        <textarea id="reflection-${who}" rows="4" placeholder="What stood out to you today?">${escapeHtml(d.reflection)}</textarea>
        <label>A question for ${NAMES[partner]}</label>
        <textarea id="question-${who}" rows="2" placeholder="Something to talk through together">${escapeHtml(d.question)}</textarea>
        <label>This chapter felt...</label>
        <div class="tag-row" id="tagrow-${who}">
          ${TAGS.map(t => `<button type="button" class="tag-chip ${d.tag===t?'active '+who+'-active':''}" data-tag="${t}" onclick="setTag('${who}','${t}')">${t}</button>`).join("")}
        </div>
        <div class="save-row">
          <button class="save-btn" onclick="saveEntry('${who}')">Save</button>
          <span class="saved-stamp">${stamp}</span>
        </div>
      </div>`;
    } else {
      const hasContent = d.verse || d.reflection || d.question;
      return `
      <div class="page ${sideClass}">
        <p class="page-name"><span class="dot ${who}"></span>${NAMES[who]}</p>
        ${hasContent ? `
          ${d.verse ? `<label>Favorite verse</label><p style="margin:0 0 10px;">${escapeHtml(d.verse)}</p>` : ''}
          ${d.reflection ? `<label>Reflection</label><p style="margin:0 0 10px; line-height:1.6;">${escapeHtml(d.reflection)}</p>` : ''}
          ${d.question ? `<label>Their question for you</label><p style="margin:0; line-height:1.6;">${escapeHtml(d.question)}</p>` : ''}
          ${d.tag ? `<span class="tag-pill ${who}">${d.tag}</span>` : ''}
          <div class="saved-stamp" style="margin-top:12px;">${stamp}</div>
        ` : `<p class="empty-note" style="text-align:left; padding:20px 0;">${NAMES[who]} hasn't written for this chapter yet.</p>`}
      </div>`;
    }
  };
  const pages = order.map(page).join("");
  const threadMsgs = [];
  order.forEach(who=>{ if(e[who].question){ threadMsgs.push({author:who, text:e[who].question, kind:'question'}); } });
  (e.replies||[]).forEach(r=> threadMsgs.push({author:r.author, text:r.text, kind:'reply'}));
  const threadHtml = threadMsgs.length ? threadMsgs.map(m=>`
    <div class="msg"><span class="dot ${m.author}"></span>
      <div class="msg-body"><span class="msg-author" style="color:var(--${m.author})">${NAMES[m.author]}</span>${m.kind==='question'?'asked':'replied'}: ${escapeHtml(m.text)}</div>
    </div>`).join("") : `<p class="empty-note">No questions yet — write one on your page above.</p>`;

  const bothWrote = e.savanna.reflection && e.jack.reflection;
  const alreadyAdvancedToday = data.lastAdvancedDate === todayStr();
  let disabled = false, note = "";
  if(alreadyAdvancedToday){ disabled = true; note = "You've already moved forward today. Come back tomorrow for the next chapter."; }
  else if(!bothWrote){ disabled = true; note = "Both of you need to save a reflection before moving on to the next chapter."; }
  else { note = "Once you both save, you can move forward once — then it's tomorrow's turn."; }

  return `
  <div class="today-card">
    <div class="today-title">
      <p class="book">${f.book} ${f.chapter}</p>
      <p class="meta">${sectionOf(f.bookIdx).name} · chapter ${idx+1} of ${TOTAL}</p>
    </div>
    <div class="spread">${pages}</div>
    <div class="thread">
      <p class="thread-title">Questions for each other</p>
      ${threadHtml}
      <div class="reply-row">
        <input type="text" id="reply-input" placeholder="Reply to a question, or add a thought...">
        <button onclick="addReply()">Send</button>
      </div>
    </div>
  </div>
  <div class="advance-wrap">
    <button class="advance-btn" ${disabled?'disabled':''} onclick="advanceChapter()">Mark today's chapter complete →</button>
    <p class="advance-note">${note}</p>
  </div>`;
}

function renderJournal(){
  if(data.currentIndex === 0){
    return `<div class="journal"><p class="journal-title">Your journal</p><p class="empty-note">Finish your first chapter to start building your journal together.</p></div>`;
  }
  const term = journalSearchTerm.trim().toLowerCase();
  let rows = "";
  let matchCount = 0;
  for(let i=data.currentIndex-1; i>=0; i--){
    const f = FLAT[i];
    const e = entryFor(i);
    if(term){
      const haystack = [f.book, e.savanna.verse, e.savanna.reflection, e.savanna.question, e.savanna.tag,
                         e.jack.verse, e.jack.reflection, e.jack.question, e.jack.tag].join(" ").toLowerCase();
      if(!haystack.includes(term)) continue;
    }
    matchCount++;
    const open = openJournalIdx===i || term ? 'open' : '';
    rows += `
    <div class="jentry ${open}">
      <div class="jentry-head" onclick="toggleJournal(${i})">
        <span class="ref">${f.book} ${f.chapter}</span>
        <span class="arrow">▸</span>
      </div>
      <div class="jentry-body">
        ${['savanna','jack'].map(who=>{
          const d = e[who];
          if(!d.reflection && !d.verse && !d.question) return `<div class="jcol ${who}"><p class="who">${NAMES[who]}</p><p style="opacity:0.5">Nothing written.</p></div>`;
          return `<div class="jcol ${who}">
            <p class="who">${NAMES[who]}</p>
            ${d.verse?`<p><em>${escapeHtml(d.verse)}</em></p>`:''}
            ${d.reflection?`<p>${escapeHtml(d.reflection)}</p>`:''}
            ${d.question?`<p>Asked: ${escapeHtml(d.question)}</p>`:''}
            ${d.tag?`<span class="tag-pill ${who}">${d.tag}</span>`:''}
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }
  if(term && matchCount === 0){ rows = `<p class="empty-note">No entries match "${escapeHtml(journalSearchTerm)}".</p>`; }
  return `<div class="journal">
    <p class="journal-title">Your journal</p>
    <input type="text" class="journal-search" placeholder="Search past reflections, verses, questions..." value="${escapeHtml(journalSearchTerm)}" oninput="setJournalSearch(this.value)">
    ${rows}
  </div>`;
}
function setJournalSearch(v){
  journalSearchTerm = v;
  render();
  const el = document.querySelector('.journal-search');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function renderMilestone(){
  if(!data.justFinishedBook) return "";
  return `
  <div class="milestone-banner">
    <button class="milestone-close" onclick="dismissMilestone()">✕</button>
    <p>🎉 You finished the book of ${data.justFinishedBook} — together.</p>
  </div>`;
}

function renderPrayers(){
  const prayers = data.prayers || [];
  const items = prayers.length ? prayers.slice().reverse().map((p, revIdx)=>{
    const i = prayers.length - 1 - revIdx;
    const date = new Date(p.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    return `
    <div class="prayer-item">
      <button class="prayer-check ${p.answered?'answered':''}" onclick="togglePrayer(${i})">${p.answered?'✓':''}</button>
      <div>
        <div class="prayer-text ${p.answered?'answered':''}">${escapeHtml(p.text)}</div>
        <div class="prayer-meta">${NAMES[p.author]} · ${date}${p.answered?' · answered':''}</div>
      </div>
    </div>`;
  }).join("") : `<p class="empty-note">Nothing here yet — add something you're praying for each other about.</p>`;
  return `
  <div class="prayer-card">
    <p class="journal-title">Praying for each other</p>
    ${items}
    <div class="prayer-add-row">
      <input type="text" id="prayer-input" placeholder="Something to pray for...">
      <button onclick="addPrayer()">Add</button>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!unlocked){ app.innerHTML = renderLock(); return; }
  if(NEEDS_SETUP){ app.innerHTML = renderSetup(); return; }
  if(!identity){ app.innerHTML = renderGate(); return; }
  app.innerHTML = `
    <div class="header">
      <div class="eyebrow">One chapter · Two hearts</div>
      <p class="hero-line">Sixty-six books, together.</p>
      <p class="hero-sub">Reading the ESV, Genesis to Revelation, one chapter a day.</p>
      <span class="switch-user" onclick="switchUser()">Not ${NAMES[identity]}? Switch</span>
      <div class="sync-status"><span class="sync-dot ${synced?'':'off'}"></span>${synced?'Synced with '+NAMES[identity==='savanna'?'jack':'savanna']:'Connecting…'}</div>
      <br>
      ${notifStatus==='on'
        ? `<span class="notif-btn on">🔔 Notifications on</span>`
        : notifStatus==='denied'
        ? `<span class="notif-btn" style="opacity:0.6;">Notifications blocked — check iPhone Settings → Notifications</span>`
        : `<span class="notif-btn" onclick="enableNotifications()">${notifStatus==='pending'?'Enabling…':'🔔 Enable notifications'}</span>`}
    </div>
    ${renderRibbon()}
    ${renderMilestone()}
    ${renderToday()}
    ${renderPrayers()}
    ${renderJournal()}
  `;
}

async function saveEntry(who){
  const idx = data.currentIndex;
  const e = entryFor(idx);
  e[who] = {
    verse: document.getElementById(`verse-${who}`).value.trim(),
    reflection: document.getElementById(`reflection-${who}`).value.trim(),
    question: document.getElementById(`question-${who}`).value.trim(),
    tag: pendingTags[who] || "",
    ts: Date.now()
  };
  await saveData();
}
function setTag(who, tag){
  pendingTags[who] = tag;
  const row = document.getElementById(`tagrow-${who}`);
  if(!row) return;
  row.querySelectorAll('.tag-chip').forEach(btn=>{
    const isMatch = btn.getAttribute('data-tag') === tag;
    btn.classList.toggle('active', isMatch);
    btn.classList.toggle(who+'-active', isMatch);
  });
}
async function addReply(){
  const input = document.getElementById('reply-input');
  const text = input.value.trim();
  if(!text) return;
  const e = entryFor(data.currentIndex);
  e.replies = e.replies || [];
  e.replies.push({author: identity, text, ts: Date.now()});
  await saveData();
}
async function addPrayer(){
  const input = document.getElementById('prayer-input');
  const text = input.value.trim();
  if(!text) return;
  data.prayers = data.prayers || [];
  data.prayers.push({author: identity, text, ts: Date.now(), answered:false});
  await saveData();
}
async function togglePrayer(i){
  if(!data.prayers || !data.prayers[i]) return;
  data.prayers[i].answered = !data.prayers[i].answered;
  await saveData();
}
const GRACE_DAYS_PER_MONTH = 3;
function monthKeyFor(date){ return date.getFullYear()+"-"+(date.getMonth()+1); }

async function advanceChapter(){
  if(data.currentIndex >= TOTAL-1) return;
  const e = entryFor(data.currentIndex);
  if(!(e.savanna.reflection && e.jack.reflection)) return;
  if(data.lastAdvancedDate === todayStr()) return;

  const finishedBook = FLAT[data.currentIndex].book;
  const startingNewBook = FLAT[data.currentIndex+1].book !== finishedBook;

  const today = new Date();
  const todayKey = today.toDateString();
  const mKey = monthKeyFor(today);
  if(!data.streak) data.streak = {count:0, graceMonth:mKey, graceUsed:0};
  if(data.streak.graceMonth !== mKey){ data.streak.graceMonth = mKey; data.streak.graceUsed = 0; }

  if(!data.lastAdvancedDate){
    data.streak.count = 1;
  } else {
    const last = new Date(data.lastAdvancedDate);
    const diffDays = Math.round((new Date(todayKey) - new Date(last.toDateString())) / 86400000);
    if(diffDays === 1){
      data.streak.count = (data.streak.count||0) + 1;
    } else if(diffDays > 1){
      const missed = diffDays - 1;
      if(data.streak.graceUsed + missed <= GRACE_DAYS_PER_MONTH){
        data.streak.graceUsed += missed;
        data.streak.count = (data.streak.count||0) + 1;
      } else {
        data.streak.count = 1;
      }
    }
  }

  data.currentIndex += 1;
  data.lastAdvancedDate = todayKey;
  data.justFinishedBook = startingNewBook ? finishedBook : null;
  data.advanceLog = data.advanceLog || [];
  data.advanceLog.push({ ts: Date.now(), ref: `${finishedBook} ${FLAT[data.currentIndex-1].chapter}` });
  if(data.advanceLog.length > 60) data.advanceLog = data.advanceLog.slice(-60); // keep it small
  await saveData();
}
function dismissMilestone(){ data.justFinishedBook = null; saveData(); }
function toggleJournal(i){ openJournalIdx = openJournalIdx === i ? null : i; render(); }

async function enableNotifications(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)){
    alert("This browser/device doesn't support notifications. On iPhone, make sure you're using this from the home screen icon, not a Safari tab.");
    return;
  }
  notifStatus = 'pending';
  render();
  try{
    const swReg = await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      notifStatus = 'denied';
      localStorage.setItem('workbook-notif-status', 'denied');
      render();
      return;
    }
    messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
    if(token){
      data.tokens = data.tokens || {};
      data.tokens[identity] = { token, updatedAt: Date.now() };
      await saveData();
      notifStatus = 'on';
      localStorage.setItem('workbook-notif-status', 'on');
    }
  }catch(e){
    console.error('Notification setup failed', e);
    notifStatus = 'off';
  }
  render();
}

function init(){
  if(NEEDS_SETUP){ render(); return; }
  const app = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  const ref = db.collection('workbook').doc('data');
  ref.onSnapshot((snap)=>{
    data = snap.exists ? snap.data() : defaultData();
    synced = true;
    render();
  }, (err)=>{
    console.error(err);
    if(!data) data = defaultData();
    synced = false;
    render();
  });
  if(!identity){ render(); }

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
  }
}
init();
</script>
</body>
</html>
